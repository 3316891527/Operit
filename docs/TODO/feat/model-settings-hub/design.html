function renderFunctionDialog(){
 const item=state.dialog.draft;const profile=item.config?getProfile(item.config):null;const warning=warningFor(item);
 const body=`<p class="small muted" style="margin-bottom:18px">${esc(item.desc)}</p><div class="scope-note">${icon('info')}<span>这是全局功能分配。修改后，应用中的“${esc(item.title)}”使用此处选择的模型。</span></div><div class="field"><label for="binding-config">使用的配置</label><select id="binding-config" data-bind-config>${profileOptions(item.config,item.id==='MEMORY_EMBEDDING')}</select><small>可选择其他分组中的配置。</small></div>${profile?`<div class="field"><label for="binding-model">具体模型</label><select id="binding-model" data-bind-model>${profile.models.map(model=>`<option ${item.model===model?'selected':''}>${esc(model)}</option>`).join('')}</select></div><div class="selected-model"><p class="small muted">${esc(profile.group)} / ${esc(profile.name)}</p><p class="break" style="margin-top:4px">${esc(item.model)}</p></div>`:'<div class="notice">记忆向量尚未配置。选择向量模型后才能进行对应的语义检索。</div>'}${warning&&profile?`<div class="notice" style="margin-bottom:16px">${esc(warning)}。请核对模型支持情况，并在连接设置中开启对应能力。</div>`:''}${profile&&item.id!=='MEMORY_EMBEDDING'?`<div class="field"><label for="binding-thinking">思考设置</label><select id="binding-thinking" data-bind-thinking>${[['on','开启思考'],['off','关闭思考']].map(([value,label])=>`<option value="${value}" ${item.thinking===value?'selected':''}>${label}</option>`).join('')}</select></div>${item.thinking==='on'?`<div class="field"><label for="binding-level">思考档位</label><select id="binding-level" data-bind-level>${[['low','低'],['medium','中'],['high','高']].map(([value,label])=>`<option value="${value}" ${item.level===value?'selected':''}>${label}</option>`).join('')}</select><small>正式界面按所选模型的思考规则提供可用档位。</small></div>`:''}`:''}<div class="actions">${profile?`<button class="text-button" data-action="edit-bound-profile">编辑连接与参数</button>`:''}<button class="text-button" data-action="function-test-preview" ${!profile?'disabled':''}>功能测试预览</button></div>`;
 showDialog(item.title,body,cancelButton+'<button class="button primary" data-action="save-function">保存分配</button>');
}
function renderSummaryEditor(){
 const draft=state.dialog.draft;
 const body=`<p class="small muted" style="margin-bottom:17px">只修改“${esc(getProfile(state.summaryId).name)}”的摘要结构。关闭某个板块后，生成摘要时不再输出该板块。</p><div class="field"><label for="summary-custom-rules">总结补充规则</label><textarea id="summary-custom-rules" data-summary-draft="rules" placeholder="希望每次总结都遵守的要求">${esc(draft.rules)}</textarea></div>${draft.sections.map((section,index)=>`<section class="section-editor"><label class="option-row"><input type="checkbox" data-section-enabled="${index}" ${section.enabled?'checked':''}>${esc(section.title)}</label><div class="field"><label for="section-title-${index}">板块标题</label><input type="text" id="section-title-${index}" data-section-index="${index}" data-section-prop="title" value="${esc(section.title)}" ${!section.enabled?'disabled':''}></div><div class="field"><label for="section-rule-${index}">板块说明</label><textarea id="section-rule-${index}" data-section-index="${index}" data-section-prop="instruction" ${!section.enabled?'disabled':''}>${esc(section.instruction)}</textarea></div></section>`).join('')}<div class="section-editor"><label class="option-row"><input type="checkbox" data-summary-review ${draft.dialogueReview?'checked':''}>附带对话回顾</label><div class="field"><label for="review-title">回顾标题</label><input id="review-title" type="text" value="${esc(draft.reviewTitle)}" data-summary-draft="reviewTitle" ${!draft.dialogueReview?'disabled':''}></div></div>`;
 showDialog('摘要结构与规则',body,cancelButton+'<button class="button primary" data-action="save-summary-editor">保存</button>');
}
function openTestPreview(returnFunction=false){
 const source=returnFunction?state.dialog.id:'';const parent=returnFunction?state.dialog:null;
 state.dialog={type:'test',source,parent};
 showDialog('连接与功能测试预览','<p class="small muted">设计稿不会发送 API 请求。请选择一种示例状态查看界面反馈。</p><div class="filters">'+[['running','测试中'],['passed','通过'],['unverified','未验证'],['failed','失败']].map(([key,label])=>`<button class="filter" data-action="test-state" data-value="${key}">${label}</button>`).join('')+'<div id="test-result" class="result">尚未选择示例状态。</div>',source?'<button class="button" data-action="return-function">返回功能设置</button>':doneButton);
}
function openProfileForm(mode){
 const profile=getProfile(state.editId);state.dialog={type:'profile-form',mode};
 showDialog(mode==='new'?'添加模型配置':'重命名配置',`<div class="field"><label for="profile-name">配置名称</label><input id="profile-name" type="text" maxlength="80" value="${mode==='new'?'':esc(profile.name)}" placeholder="例如 日常对话"></div>${mode==='new'?`<div class="field"><label for="profile-group">所属分组</label><select id="profile-group">${groups().map(group=>`<option>${esc(group)}</option>`).join('')}</select></div><p class="small muted">创建后进入连接设置，填写服务方式、端点和模型。</p>`:''}`,cancelButton+'<button class="button primary" data-action="save-profile-form">保存</button>');
}
function routeTo(route){if(location.hash===`#${route}`){render();}else{location.hash=route;}}
document.addEventListener('click',event=>{
 const profileLink=event.target.closest('[data-use-profile]');
 if(profileLink){state.functionScope=`config:${profileLink.dataset.useProfile}`;state.functionQuery='';}
 const button=event.target.closest('[data-action]');if(!button||button.disabled)return;
 const action=button.dataset.action;
 if(action==='navigate'){routeTo(button.dataset.value);}
 else if(action==='close-dialog'){closeDialog();}
 else if(action==='group'){state.group=button.dataset.value;render();}
 else if(action==='detail-tab'){routeTo(`config/${state.editId}/${button.dataset.value}`);}
 else if(action==='function-scope'){state.functionScope=button.dataset.value;render();}
 else if(action==='edit-function'){openFunction(button.dataset.id);}
 else if(action==='save-function'){
  const draft=state.dialog.draft;Object.assign(getFunction(draft.id),draft);
  if(draft.id==='CHAT'&&!state.summaryPinned)state.summaryId=draft.config;
  closeDialog();render();notify('已在当前设计稿中更新功能分配');
 }
 else if(action==='function-filter'){
  state.dialog={type:'filter'};
  showDialog('按配置筛选功能',`<button class="list-item" data-action="choose-filter" data-value="all"><span class="grow">全部配置</span>${state.functionScope==='all'?icon('check'):''}</button>${profiles.map(profile=>`<button class="list-item" data-action="choose-filter" data-value="config:${profile.id}"><div class="grow"><h3>${esc(profile.name)}</h3><p>${esc(profile.group)}</p></div>${pill(`${functions.filter(item=>item.config===profile.id).length} 项`)}</button>`).join('')}`,cancelButton);
 }
 else if(action==='choose-filter'){state.functionScope=button.dataset.value;closeDialog();render();}
 else if(action==='toggle'){
  const scope=button.dataset.scope,key=button.dataset.key;
  if(scope==='policy'){const policy=getProfile(state.summaryId).policy;policy[key]=!policy[key];}
  else if(scope==='caps'){const caps=getProfile(state.editId).caps;caps[key]=!caps[key];}
  render();
 }
 else if(action==='profile-policy'){state.summaryId=state.editId;state.summaryPinned=true;routeTo('context');}
 else if(action==='summary-editor'){state.dialog={type:'summary',draft:structuredClone(getProfile(state.summaryId).policy)};renderSummaryEditor();}
 else if(action==='save-summary-editor'){
  const draft=state.dialog.draft;
  if(draft.sections.some(section=>section.enabled&&!section.title.trim())){dialogError('启用的摘要板块需要填写标题。');return;}
  const policy=getProfile(state.summaryId).policy;
  for(const key of ['rules','sections','dialogueReview','reviewTitle'])policy[key]=structuredClone(draft[key]);
  closeDialog();render();notify('已在当前设计稿中保存摘要结构');
 }
 else if(action==='summary-preview'){
  const policy=getProfile(state.summaryId).policy;
  state.dialog={type:'summary-preview'};
  showDialog('摘要结构预览','<p class="small muted" style="margin-bottom:17px">这里只预览标题排列，不生成对话摘要。</p>'+policy.sections.filter(section=>section.enabled).map(section=>`<div class="section-editor"><h3>${esc(section.title)}</h3><p class="small muted" style="margin-top:8px">${esc(section.instruction)}</p></div>`).join('')+(policy.dialogueReview?`<div class="section-editor"><h3>${esc(policy.reviewTitle)}</h3><p class="small muted">用户、助手与工具调用记录</p></div>`:''),doneButton);
 }
 else if(action==='demo-test'){openTestPreview();}
 else if(action==='function-test-preview'){openTestPreview(true);}
 else if(action==='test-state'){
  const status={running:['muted','示例：正在测试','正在请求所选模型…'],passed:['good','示例：测试通过','请求及对应能力检查完成。'],unverified:['warning','示例：能力未验证','请求可完成，当前条件不足以确认该项能力。'],failed:['danger','示例：测试失败','请求失败，展开错误详情后可查看返回内容。']}[button.dataset.value];
  $('#test-result').innerHTML=`<strong class="${status[0]}">${status[1]}</strong><p class="small muted" style="margin-top:7px">${status[2]}</p><p class="small muted" style="margin-top:9px">以上均为展示数据，没有真实请求。</p>`;
  $('#dialog-body').querySelectorAll('[data-action="test-state"]').forEach(item=>item.classList.toggle('selected',item===button));
 }
 else if(action==='return-function'){state.dialog=state.dialog.parent;renderFunctionDialog();}
 else if(action==='edit-bound-profile'){
  const saved=getFunction(state.dialog.id),draft=state.dialog.draft;
  if(saved.config!==draft.config||saved.model!==draft.model||saved.thinking!==draft.thinking||saved.level!==draft.level){dialogError('请先保存当前分配，或取消修改后再编辑连接。');return;}
  const id=draft.config;closeDialog();routeTo(`config/${id}/connection`);
 }
 else if(action==='reset-functions'){
  state.dialog={type:'reset'};showDialog('重置功能分配','<p>将所有普通功能绑定“日常对话”的第一个模型，思考设置改为关闭。记忆向量设为未配置。</p><p class="small muted" style="margin-top:12px">模型配置、连接和参数会继续保留。</p>',cancelButton+'<button class="button primary" data-action="confirm-reset">重置分配</button>');
 }
 else if(action==='confirm-reset'){
  functions.forEach(item=>{item.config=item.id==='MEMORY_EMBEDDING'?'':'daily';item.model=item.config?getProfile('daily').models[0]:'';item.thinking='off';});
  if(!state.summaryPinned)state.summaryId='daily';closeDialog();render();notify('已重置当前设计稿中的功能分配');
 }
 else if(action==='new-profile'){openProfileForm('new');}
 else if(action==='rename-profile'){openProfileForm('rename');}
 else if(action==='save-profile-form'){
  const name=$('#profile-name').value.trim();if(!name){dialogError('请填写配置名称。');return;}
  if(state.dialog.mode==='rename'){getProfile(state.editId).name=name;closeDialog();render();}
  else{const id=`config-${state.nextProfileId++}`;profiles.push(makeProfile(id,name,$('#profile-group').value,'chat',['请填写模型名称'],{tools:true,stream:true,image:false,audio:false,video:false}));closeDialog();state.group='全部';state.modelQuery='';routeTo(`config/${id}/connection`);}
 }
 else if(action==='profile-menu'){
  const profile=getProfile(state.editId);state.dialog={type:'profile-menu'};
  showDialog(profile.name,`<button class="list-item" data-action="rename-profile">重命名</button><button class="list-item" data-action="copy-profile">复制配置</button><button class="list-item" data-action="profile-preview">配置预览</button><button class="list-item danger" data-action="delete-profile">删除配置</button>`,cancelButton);
 }
 else if(action==='copy-profile'){
  const profile=structuredClone(getProfile(state.editId));profile.id=`config-${state.nextProfileId++}`;profile.name+=' 副本';profile.apiKey='';profiles.push(profile);closeDialog();routeTo(`config/${profile.id}/connection`);notify('已复制示例配置，密钥未复制');
 }
 else if(action==='profile-preview'){
  const profile=getProfile(state.editId);
  showDialog('配置预览',`<div class="stack"><p class="break">配置：${esc(profile.name)}</p><p class="break">分组：${esc(profile.group)}</p><p class="break">服务：${esc(protocolNames[profile.protocol])}</p><p class="break">端点：${esc(profile.endpoint)}</p><p class="break">模型：${esc(profile.models.join(' / '))}</p><p>上下文：${profile.policy.contextLength}K / ${profile.policy.maxContextLength}K</p></div>`,doneButton);
 }
 else if(action==='delete-profile'){
  const used=functions.filter(item=>item.config===state.editId);
  if(state.editId==='daily'||used.length){showDialog('配置仍在使用',`<p>${state.editId==='daily'?'默认配置需要保留。':`请先为以下功能重新分配模型：${used.map(item=>esc(item.title)).join('、')}。`}</p>`,doneButton);}
  else{state.dialog={type:'delete',id:state.editId};showDialog('删除配置',`<p>删除“${esc(getProfile(state.editId).name)}”？</p>`,cancelButton+'<button class="button danger" data-action="confirm-delete">删除</button>');}
 }
 else if(action==='confirm-delete'){
  const id=state.dialog.id;profiles.splice(profiles.findIndex(profile=>profile.id===id),1);
  if(state.summaryId===id){state.summaryId=currentChat();state.summaryPinned=false;}
  if(state.functionScope===`config:${id}`)state.functionScope='all';
  state.group='全部';closeDialog();routeTo('models');
 }
 else if(action==='edit-models'){
  state.dialog={type:'models'};showDialog('编辑模型列表',`<div class="field"><label for="models-editor">模型名称，每行一个</label><textarea id="models-editor" rows="6">${esc(getProfile(state.editId).models.join('\n'))}</textarea><small>正在被功能使用的模型，需要先调整分配后才能移除。</small></div>`,cancelButton+'<button class="button primary" data-action="save-models">保存</button>');
 }
 else if(action==='save-models'){
  const models=[...new Set($('#models-editor').value.split(/\n|,/).map(model=>model.trim()).filter(Boolean))];
  if(!models.length){dialogError('至少保留一个模型。');return;}
  const used=functions.filter(item=>item.config===state.editId&&!models.includes(item.model));
  if(used.length){dialogError('以下功能还在使用被移除的模型：'+used.map(item=>item.title).join('、'));return;}
  getProfile(state.editId).models=models;closeDialog();render();
 }
 else if(action==='key-preview'){
  state.dialog={type:'keys'};showDialog('密钥管理',`<div class="scope-note">${icon('info')}<span>此处为示例密钥状态，不包含真实密钥。</span></div><div class="card"><div class="list-item"><div class="grow"><h3>示例密钥 01</h3><p>•••• •••• demo-01</p></div>${pill('启用','active')}</div><div class="list-item"><div class="grow"><h3>示例密钥 02</h3><p>•••• •••• demo-02</p></div>${pill('暂停')}</div></div><p class="footer-hint">单密钥与密钥池继续在同一处管理。</p>`,doneButton);
 }
 else if(action==='other-design'){
  state.dialog={type:'other'};showDialog('其他设置设计稿','<p>本轮重点是模型配置、功能分配和上下文与总结。</p><p class="small muted" style="margin-top:12px">主题、显示与行为、角色卡、工具权限和数据备份的已有设计稿，可从本次交付的统一索引打开。</p>',doneButton);
 }
});
document.addEventListener('input',event=>{
 const input=event.target;
 if(input.dataset.search==='models'){state.modelQuery=input.value;$('#model-results').innerHTML=renderModelResults();}
 else if(input.dataset.search==='functions'){state.functionQuery=input.value;$('#function-results').innerHTML=renderFunctionResults();}
 else if(input.hasAttribute('data-threshold')){
  const policy=getProfile(state.summaryId).policy;policy.threshold=Number(input.value);
  $('#threshold-value').textContent=`${policy.threshold}%`;$('#context-meter-fill').style.width=`${policy.threshold}%`;$('#threshold-description').textContent=`以 ${policy.contextLength}K 日常上下文计算，约 ${formatThreshold(policy)}K 时触发。`;
 }
 else if(input.hasAttribute('data-summary-draft')){state.dialog.draft[input.dataset.summaryDraft]=input.value;}
 else if(input.hasAttribute('data-section-prop')){state.dialog.draft.sections[Number(input.dataset.sectionIndex)][input.dataset.sectionProp]=input.value;}
});
document.addEventListener('change',event=>{
 const input=event.target;
 if(input.hasAttribute('data-bind-config')){const draft=state.dialog.draft;draft.config=input.value;draft.model=draft.config?getProfile(draft.config).models[0]:'';renderFunctionDialog();}
 else if(input.hasAttribute('data-bind-model')){state.dialog.draft.model=input.value;renderFunctionDialog();}
 else if(input.hasAttribute('data-bind-thinking')){state.dialog.draft.thinking=input.value;renderFunctionDialog();}
 else if(input.hasAttribute('data-bind-level')){state.dialog.draft.level=input.value;}
 else if(input.hasAttribute('data-summary-select')){state.summaryId=input.value;state.summaryPinned=true;render();}
 else if(input.hasAttribute('data-section-enabled')){state.dialog.draft.sections[Number(input.dataset.sectionEnabled)].enabled=input.checked;renderSummaryEditor();}
 else if(input.hasAttribute('data-summary-review')){state.dialog.draft.dialogueReview=input.checked;renderSummaryEditor();}
 else if(input.hasAttribute('data-protocol')){getProfile(state.editId).protocol=input.value;}
 else if(input.hasAttribute('data-header-preview')){getProfile(state.editId).headers=input.value;}
 else if(input.hasAttribute('data-field')){
  const scope=input.dataset.scope,key=input.dataset.field;
  if(!input.checkValidity()){notify('请检查输入范围和格式');return;}
  if(scope==='profile'){getProfile(state.editId)[key]=input.value;return;}
  const value=Number(input.value);
  if(scope==='policy'){
   const policy=getProfile(state.summaryId).policy;
   const context=key==='contextLength'?value:policy.contextLength,max=key==='maxContextLength'?value:policy.maxContextLength;
   if(context>max){$('#policy-error').textContent='日常上下文不能超过 API 最大上下文。';input.setAttribute('aria-invalid','true');return;}
   policy[key]=value;input.removeAttribute('aria-invalid');$('#policy-error').textContent='';
   $('#threshold-description').textContent=`以 ${policy.contextLength}K 日常上下文计算，约 ${formatThreshold(policy)}K 时触发。`;
  }else if(scope==='retention'){state.retention[key]=value;}
  else if(scope==='params'){getProfile(state.editId).params[key]=value;}
 }
});
document.addEventListener('toggle',event=>{const detail=event.target;if(detail.matches('details[data-detail]')){if(detail.open)state.openDetails.add(detail.dataset.detail);else state.openDetails.delete(detail.dataset.detail);}},true);
document.addEventListener('keydown',event=>{
 const tab=event.target.closest('[role="tab"]');if(!tab||!['ArrowLeft','ArrowRight','Home','End'].includes(event.key))return;
 const tabs=[...tab.parentElement.querySelectorAll('[role="tab"]')];let index=tabs.indexOf(tab);
 if(event.key==='ArrowLeft')index=(index+tabs.length-1)%tabs.length;
 else if(event.key==='ArrowRight')index=(index+1)%tabs.length;
 else index=event.key==='Home'?0:tabs.length-1;
 event.preventDefault();const target=tabs[index],id=target.id;target.click();requestAnimationFrame(()=>{const next=document.getElementById(id);if(next)next.focus({preventScroll:true});});
});
$('#modal').addEventListener('cancel',()=>{state.dialog=null;});
$('#modal').addEventListener('click',event=>{if(event.target===$('#modal'))closeDialog();});
$('#theme-button').addEventListener('click',()=>{const light=document.documentElement.dataset.theme==='dark';document.documentElement.dataset.theme=light?'light':'dark';$('#theme-button').textContent=light?'切换深色':'切换浅色';});
window.addEventListener('hashchange',()=>{if($('#modal').open)closeDialog();render();window.scrollTo(0,0);});
if(new URLSearchParams(location.search).get('theme')==='light'){document.documentElement.dataset.theme='light';$('#theme-button').textContent='切换深色';}
render();
</script>
</body>
</html>
