<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src data:; font-src 'none'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
    <title>Mermaid</title>
    <style>
        :root { color-scheme: dark; font-family: sans-serif; }
        * { box-sizing: border-box; }
        html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #1e1e1e; color: #ddd; }
        body { -webkit-user-select: none; user-select: none; }
        #viewport { position: absolute; inset: 0; overflow: auto; padding: 16px; touch-action: pan-x pan-y; }
        #sizer { position: relative; }
        #diagram { position: absolute; top: 0; left: 0; transform-origin: 0 0; }
        #diagram svg { display: block; max-width: none !important; }
        #status { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; font: 14px/1.5 sans-serif; }
        #status.error { color: #f2b8b5; }
        #controls { position: fixed; right: 8px; bottom: 8px; display: flex; gap: 4px; padding: 4px; border-radius: 6px; background: #252526ed; }
        button { width: 32px; height: 32px; border: 0; border-radius: 4px; background: #383838; color: #eee; font-size: 18px; }
        button:disabled { opacity: .4; }
    </style>
    <script defer src="mermaid.min.js"></script>
    <script defer src="renderer.js"></script>
</head>
<body>
    <div id="viewport">
        <pre id="status" role="status" aria-live="polite"></pre>
        <div id="sizer"><div id="diagram"></div></div>
    </div>
    <div id="controls">
        <button id="zoom-out" disabled>−</button>
        <button id="fit" disabled>↺</button>
        <button id="zoom-in" disabled>+</button>
    </div>
</body>
</html>
