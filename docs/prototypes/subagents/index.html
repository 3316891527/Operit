  function preserveFocus() {
    const el = document.activeElement;
    if(!el || el === document.body) return null;
    const scope = el.closest('#inspector,#pageBody,#activityStrip,#sidebar,#center,#modal');
    return {element:el,id:el.id,scope:scope && scope.id,action:el.dataset.action,data:{...el.dataset},start:typeof el.selectionStart === 'number' ? el.selectionStart : null,end:typeof el.selectionEnd === 'number' ? el.selectionEnd : null};
  }
  function restoreFocus(saved) {
    if(!saved) return;
    let el = null;
    if(saved.element.isConnected) el = saved.element;
    else if(saved.id) el = $(saved.id);
    else if(saved.action && saved.scope) el = [...$(saved.scope).querySelectorAll('[data-action]')].find(item => Object.entries(saved.data).every(([key,value]) => item.dataset[key] === value));
    if(!el || el.closest('[inert]') || el.offsetParent === null) return;
    el.focus({preventScroll:true});
    if(saved.start !== null && ['textarea','text','search'].includes(el.type)) el.setSelectionRange(saved.start,saved.end);
  }
  function overlayMode() { return window.matchMedia('(max-width:1190px)').matches; }
  function syncOverlay() {
    const modalPanel = state.panelOpen && overlayMode();
    $('center').inert = modalPanel || state.navOpen;
    $('sidebar').inert = modalPanel;
    $('inspector').inert = state.navOpen;
    if(state.navOpen) { $('sidebar').setAttribute('role','dialog'); $('sidebar').setAttribute('aria-modal','true'); }
    else { $('sidebar').removeAttribute('role'); $('sidebar').removeAttribute('aria-modal'); }
    $('inspector').classList.toggle('open',state.panelOpen);
    $('sidebar').classList.toggle('open',state.navOpen);
    $('scrim').classList.toggle('show',modalPanel || state.navOpen);
    if(modalPanel) { $('inspector').setAttribute('role','dialog'); $('inspector').setAttribute('aria-modal','true'); }
    else { $('inspector').setAttribute('role','complementary'); $('inspector').removeAttribute('aria-modal'); }
  }

    document.documentElement.dataset.theme = state.theme;
    document.querySelectorAll('[data-action="theme"]').forEach(el => {
      el.innerHTML = icon(state.theme === 'dark' ? 'sun' : 'moon','sm');

    });

    content.scrollTop = state.page === 'chat' && atBottom ? content.scrollHeight : previousScroll;
    $('inspectorContent').scrollTop = detailScroll;

    if(state.panelOpen && overlayMode() && !$('modal').open && !$('inspector').contains(document.activeElement)) $('inspector').querySelector('[data-action="close-detail"]').focus({preventScroll:true});

  function guide() {

  function stopTask(id) {
    const task = taskById(id);
    if(!task || !live(task)) { toast('这次执行已经结束，未停止其它任务。'); closeModal(); return; }
    task.status = 'cancelled';
    task.pending.forEach(message => { message.delivery = 'missed'; });
    task.pending = [];
    log(task,'这一项已被停止','保留已有记录，其它子代理继续执行。','error');
    fillSlots();

    render();

  function resumeTask(id, followup = '') {
    const task = taskById(id);
    if(!task || !terminal(task)) { closeModal(); toast('这项任务目前不能继续。'); return; }
    const completed = task.status === 'completed';
    if(completed) {
      task.step = 0;
      task.lastStage = -1;
      task.elapsed = 0;
      task.report = null;
      task.delivery = 'none';
      // 历史汇总持有报告快照，后续执行不会改写已经交付的结论。
      task.followup = true;
      task.stages = [['理解后续任务','阅读任务','确认新目标与已有上下文'],['继续独立工作','分析材料','沿用当前子会话的历史'],['返回补充报告','整理结果','将本次结论送回主代理']];
      task.messages.push({role:'coordinator',text:followup});
      task.goal = followup;
    }
    task.status = 'queued';
    task.attempt += 1;
    task.error = '';
    task.archived = false;
    state.batchSuspended = false;
    log(task,completed ? '收到后续任务' : '恢复任务','沿用已有子会话，以新的执行身份继续。','message');
    fillSlots();
    closeModal();
    state.playing = true;
    runTimer();
    render();
    toast(completed ? '已在同一子会话中开始后续工作。' : '已保留记录并继续执行。');
  }
  function summarize() {
    const complete = state.tasks.filter(task => task.status === 'completed');
    if(!complete.length) { toast('还没有已完成的报告，可以先推进演示。'); return; }
    for(const task of complete) {
      const key = reportKey(task);
      if(state.summaryIds.includes(key)) continue;
      state.summaryIds.push(key);
      state.summaryReports.push({taskId:task.id,attempt:task.attempt,title:task.title,report:clone(task.report)});
    }
    complete.forEach(task => { task.delivery = 'consumed'; });
    closeModal();
    state.page = 'chat';
    state.selected = null;
    state.panelOpen = false;
    render();
    $('contentArea').scrollTop = $('contentArea').scrollHeight;
    announce('主代理已把返回的报告整理成一份方案。');

  function reportText() {
    const tasks = state.summaryReports;
    return '# Operit 子代理交互方案 · 演示\n\n这是 HTML 原型生成的预设演示报告，不是真实模型执行结果。\n\n' + tasks.map(task => `## ${task.title} · 第 ${task.attempt} 次执行\n\n${task.report.map(line => '- ' + line).join('\n')}`).join('\n\n') + '\n\n## 交互建议\n\n主聊天保留紧凑任务卡，详情展示状态与结果，子会话保留独立过程。结果回传后由主代理统一整理。\n';
  }
  function showReport() {
    if(!state.summaryIds.length) { toast('请先让主代理汇总返回的报告。'); return; }
    showModal('Operit 子代理 · 交互方案',`<span class="pill">${icon('file','xs')}前端演示报告</span><div class="detail-prose" style="margin-top:17px"><p>主聊天保留方向和最终结论，子代理各自处理独立任务。</p><ul><li>卡片：角色、当前动作、真实状态与结果入口。</li><li>详情：任务、进度、报告、补充与单项停止。</li><li>子会话：独立过程和后续工作。</li></ul><p>结果送回后，再由主代理核对、去重和整理。中断和失败保留具体原因，不混成完成。</p></div><div class="modal-footer">${button('close-modal','关闭')}${button('download','下载 Markdown','','primary','download')}</div>`);
  }
  function sendSteer() {
    const task = taskById(state.selected);
    const text = state.steerDraft.trim();
    if(!text) { toast('先写一句想补充的要求。'); return; }
    if(!task || !live(task)) { toast('任务已经结束，可以使用“继续此任务”。'); return; }
    queueNote(task,text);
    state.steerDraft = '';
    state.steerOpen = false;
    state.tab = 'conversation';
    render();
    $('inspectorContent').scrollTop = $('inspectorContent').scrollHeight;
    toast('补充已排队，将在下一轮读取。');
  }
  // 单一事件入口使页面重绘不会重复注册监听器。
  document.addEventListener('click',event => {
    const target = event.target.closest('[data-action]');
    if(!target || target.disabled) return;
    const action = target.dataset.action;
    const id = target.dataset.task;
    if(action === 'navigate') navigate(target.dataset.page);
    else if(action === 'start') start(true);
    else if(action === 'open-task') openTask(id);
    else if(action === 'close-detail') closeDetail();
    else if(action === 'theme') { state.theme = state.theme === 'dark' ? 'light' : 'dark'; render(); }
    else if(action === 'menu') { state.navOpen = !state.navOpen; syncOverlay(); if(state.navOpen) $('sidebar').querySelector('button').focus(); }
    else if(action === 'dismiss-overlay') { if(state.navOpen) { state.navOpen = false; syncOverlay(); $('center').querySelector('[data-action="menu"]').focus(); } else closeDetail(); }
    else if(action === 'guide') guide();
    else if(action === 'guide-start') { closeModal(); navigate('chat'); if(!state.started) start(true); }
    else if(action === 'close-modal') closeModal();
    else if(action === 'controls') controls();
    else if(action === 'toggle-play' || action === 'control-toggle') { closeModal(); if(!state.started) start(true); else if(state.batchSuspended) toast('先从中断的任务里选择“继续执行”。'); else { state.playing = !state.playing; runTimer(); render(); } }
    else if(action === 'next' || action === 'control-next') { closeModal(); state.playing = false; stopTimer(); tick(); }
    else if(action === 'complete-demo') { closeModal(); if(!state.started) start(false); state.playing = false; stopTimer(); if(state.batchSuspended) toast('请先恢复中断的任务。'); else { for(let step=0;step<200 && state.tasks.some(live);step++) tick(false); render(); toast('待执行任务已依次完成，可以让主代理汇总。'); } }
    else if(action === 'interrupt-demo') interruptDemo();
    else if(action === 'fail-demo') failDemo();
    else if(action === 'collapse') { state.groupCollapsed = !state.groupCollapsed; render(); }
    else if(action === 'detail-tab') { state.tab = target.dataset.tab; state.steerOpen = false; render(); $('inspectorContent').scrollTop = 0; }
    else if(action === 'steer-open') { state.steerOpen = true; render(); $('steerInput').focus(); $('steerInput').scrollIntoView({block:'nearest'}); }
    else if(action === 'stop') {
      const task = taskById(id);
      if(task && live(task)) showModal('停止这一项任务？',`<p>停止“${esc(task.title)}”的当前执行，保留已有记录。其它子代理和主聊天继续工作。</p><div class="modal-footer">${button('close-modal','继续运行')}${button('confirm-stop','停止这一项',`data-task="${id}"`,'danger','stop')}</div>`);
    }
    else if(action === 'confirm-stop') stopTask(id);
    else if(action === 'resume') {
      const task = taskById(id);
      if(!task) return;
      if(task.status === 'completed') showModal('继续同一个子代理',`<form id="followupForm" data-task="${id}"><p>保留原来的子会话，交给它下一项具体工作。</p><div class="field" style="margin-top:15px"><label for="followupInput">后续任务</label><textarea id="followupInput" maxlength="1000" required placeholder="例如：把刚才的发现整理成五条验收要点。"></textarea></div><div class="modal-footer">${button('close-modal','取消')}<button type="submit" class="btn primary">开始后续工作</button></div></form>`);
      else resumeTask(id);
    }
    else if(action === 'summarize') summarize();
    else if(action === 'kind') { state.kind = target.dataset.kind; render(); }
    else if(action === 'clear-filter') { state.filter = 'all'; state.query = ''; render(); }
    else if(action === 'archive') { const task = taskById(id); if(task && terminal(task)) { task.archived = !task.archived; render(); toast(task.archived ? '已归档，记录仍可在“已归档”中找到。' : '已恢复到任务列表。'); } }
    else if(action === 'edit-role') editRole(target.dataset.role);
    else if(action === 'new-task') newTask();
    else if(action === 'report') showReport();
    else if(action === 'download') {
      const url = URL.createObjectURL(new Blob([reportText()],{type:'text/markdown;charset=utf-8'}));
      const link = document.createElement('a'); link.href = url; link.download = 'Operit子代理-演示方案.md'; document.body.append(link); link.click(); link.remove(); setTimeout(() => URL.revokeObjectURL(url),2000); toast('已生成演示报告。');
    }
    else if(action === 'reset') showModal('重新开始演示？',`<p>清空本页的演示任务和补充记录，回到分派前。角色设置和当前主题保留。</p><div class="modal-footer">${button('close-modal','取消')}${button('confirm-reset','重新开始','','primary','restart')}</div>`);
    else if(action === 'confirm-reset') { reset(); toast('已回到分派前，可以重新体验。'); }
  });
  document.addEventListener('input',event => {
    if(event.target.id === 'steerInput') state.steerDraft = event.target.value;
    else if(event.target.id === 'taskSearch') { state.query = event.target.value; if(!event.isComposing) render(); }
    else if(event.target.id === 'mainInput') { event.target.style.height = 'auto'; event.target.style.height = Math.min(event.target.scrollHeight,90) + 'px'; }
  });
  document.addEventListener('compositionstart',() => { composing = true; });
  document.addEventListener('compositionend',() => { composing = false; if(renderPending) { renderPending = false; render(); } });
  document.addEventListener('change',event => {
    if(event.target.id === 'taskSwitcher') openTask(event.target.value,true);
    if(event.target.id === 'taskFilter') { state.filter = event.target.value; render(); }
  });
  document.addEventListener('submit',event => {
    event.preventDefault();
    if(event.target.id === 'mainComposer') {
      const text = $('mainInput').value.trim();
      if(!text) return;
      $('mainInput').value = ''; $('mainInput').style.height = 'auto';
      if(text.includes('汇总') && state.tasks.some(task => task.status === 'completed')) { summarize(); return; }
      state.mainNotes.push(text);
      const receivers = state.tasks.filter(live);
      receivers.forEach(task => queueNote(task,text));
      state.mainReplies.push({text,reply:receivers.length ? `收到。我已把这条要求交给 ${receivers.length} 项进行中的任务，子代理会在下一轮读取。` : state.started ? '收到。报告和任务记录会保留；你可以点开某个子代理，继续交给它后续工作。' : '收到。这条要求会随任务一起交给子代理。准备好后点击“开始协作演示”。'});
      render(); $('contentArea').scrollTop = $('contentArea').scrollHeight;
    }
    else if(event.target.id === 'steerForm') sendSteer();
    else if(event.target.id === 'roleForm') {
      const name = $('roleName').value.trim(), description = $('roleDescription').value.trim();
      if(!name || !description) { $('roleError').textContent = '角色名称和用途都需要填写。'; return; }
      const role = roles[event.target.dataset.role]; role.name = name; role.description = description; role.model = $('roleModel').value;
      closeModal(); render(); toast('角色已保存，对之后分派的任务生效。');
    }
    else if(event.target.id === 'newTaskForm') {
      const title = $('newTaskTitle').value.trim(), goal = $('newTaskGoal').value.trim(), role = $('newTaskRole').value;
      if(!title || !goal) { $('newTaskError').textContent = '请填写任务名称和说明。'; return; }
      if(state.tasks.length >= 30) { $('newTaskError').textContent = '本次演示最多保留 30 项任务，请先重置。'; return; }
      if(!state.started) start(false);
      const task = makeTask({id:`custom-${nextTask++}`,role,title,description:goal,goal,sources:'用户补充的演示任务',custom:true,stages:[['理解任务范围','阅读任务','确认目标与交付物'],['整理任务材料','分析材料','独立完成这一项工作'],['形成最终报告','整理结果','将报告送回主代理']]});
      task.status = 'queued'; state.tasks.push(task); log(task,'收到新任务',goal,'message'); fillSlots();
      closeModal(); state.playing = !state.batchSuspended; runTimer(); state.page = 'tasks'; state.kind = 'delegated'; state.filter = 'all'; state.query = ''; render(); toast(task.status === 'running' ? '新任务已经开始。' : '新任务已排队。');
    }
    else if(event.target.id === 'followupForm') {
      const text = $('followupInput').value.trim();
      if(text) resumeTask(event.target.dataset.task,text);
    }
  });
  document.addEventListener('keydown',event => {
    if(event.key === 'Escape' && !$('modal').open) {
      if(state.navOpen) { state.navOpen = false; syncOverlay(); $('center').querySelector('[data-action="menu"]').focus(); }
      else if(state.panelOpen) closeDetail();
    }
    if(event.key === 'Enter' && !event.shiftKey && !event.isComposing && event.target.id === 'mainInput') { event.preventDefault(); $('mainComposer').requestSubmit(); }
    if(event.key === 'Enter' && !event.isComposing && (event.ctrlKey || event.metaKey) && event.target.id === 'steerInput') { event.preventDefault(); sendSteer(); }
    if(event.key !== 'Tab' || $('modal').open) return;
    const scope = state.navOpen ? $('sidebar') : state.panelOpen && overlayMode() ? $('inspector') : null;
    if(!scope) return;
    const items = [...scope.querySelectorAll('button,input,textarea,select,[tabindex="0"]')].filter(el => !el.disabled && el.offsetParent !== null);
    if(!items.length) return;
    if(event.shiftKey && document.activeElement === items[0]) { event.preventDefault(); items.at(-1).focus(); }
    else if(!event.shiftKey && document.activeElement === items.at(-1)) { event.preventDefault(); items[0].focus(); }
  });
  $('modal').addEventListener('close',() => { restoreFocus(modalOpener); });
  $('modal').addEventListener('click',event => { if(event.target === $('modal')) { const bounds = $('modal').getBoundingClientRect(); if(event.clientX < bounds.left || event.clientX > bounds.right || event.clientY < bounds.top || event.clientY > bounds.bottom) closeModal(); } });
  let touchStart = null;
  $('sheetHandle').addEventListener('touchstart',event => { touchStart = event.touches[0].clientY; },{passive:true});
  $('sheetHandle').addEventListener('touchend',event => { if(touchStart !== null && event.changedTouches[0].clientY - touchStart > 60) closeDetail(); touchStart = null; },{passive:true});
  window.addEventListener('resize',() => { if(!window.matchMedia('(max-width:720px)').matches) state.navOpen = false; syncOverlay(); });
  reset();
})();
</script>
</body>
</html>
