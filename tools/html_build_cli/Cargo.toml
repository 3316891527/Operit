[package]
name = "operit-html-build-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"

[[bin]]
# Cargo 禁止将目标命名为 build；终端命令名由安装器提供。
name = "operit-html-build"
path = "src/main.rs"

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"

[profile.release]
strip = true
lto = "thin"
